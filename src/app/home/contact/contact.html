<section class="contact-section" id="contact">

    <div class="container">

        <div class="text-center mb-5">

            <span class="section-subtitle">
                CONTACT US
            </span>

            <h2 class="section-title">
                Let's Get You Moving
            </h2>

            <p class="section-description">
                Have questions or need a ride? Reach out to Nova Cab anytime.
                We're available 24×7 to assist you.
            </p>

        </div>

        <div class="row g-4">

            <!-- Contact Information -->

            <div class="col-lg-5">

                <div class="contact-info">

                    <div class="contact-card">

                        <div class="contact-icon">
                            <i class="bi bi-telephone-fill"></i>
                        </div>

                        <div>
                            <h5>Call Us</h5>
                            <p>+91 98765 43210</p>
                        </div>

                    </div>

                    <div class="contact-card">

                        <div class="contact-icon">
                            <i class="bi bi-envelope-fill"></i>
                        </div>

                        <div>
                            <h5>Email</h5>
                            <p>support@novacab.com</p>
                        </div>

                    </div>

                    <div class="contact-card">

                        <div class="contact-icon">
                            <i class="bi bi-geo-alt-fill"></i>
                        </div>

                        <div>
                            <h5>Office</h5>
                            <p>
                                Hyderabad, Telangana, India
                            </p>
                        </div>

                    </div>

                    <div class="contact-card">

                        <div class="contact-icon">
                            <i class="bi bi-clock-fill"></i>
                        </div>

                        <div>
                            <h5>Working Hours</h5>
                            <p>24×7 Customer Support</p>
                        </div>

                    </div>

                </div>

            </div>

            <!-- Contact Form -->

            <div class="col-lg-7">

                <div class="contact-form">

                    <h3>
                        Send us a Message
                    </h3>

                    <form>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <input
                                    type="text"
                                    class="form-control"
                                    placeholder="Full Name">

                            </div>

                            <div class="col-md-6 mb-3">

                                <input
                                    type="email"
                                    class="form-control"
                                    placeholder="Email Address">

                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <input
                                    type="tel"
                                    class="form-control"
                                    placeholder="Phone Number">

                            </div>

                            <div class="col-md-6 mb-3">

                                <select class="form-select">

                                    <option selected>
                                        Select Service
                                    </option>

                                    <option>
                                        Local Ride
                                    </option>

                                    <option>
                                        Airport Transfer
                                    </option>

                                    <option>
                                        Outstation
                                    </option>

                                    <option>
                                        Corporate
                                    </option>

                                </select>

                            </div>

                        </div>

                        <div class="mb-3">

                            <textarea
                                rows="6"
                                class="form-control"
                                placeholder="Write your message..."></textarea>

                        </div>

                        <button class="btn btn-warning">

                            Send Message

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</section>
